name: Compare Revolution Fingerprints

on:
  push:
    paths:
      - 'audio/Spoke test new.wav'
      - 'src/compare_revolution_fingerprints.py'
      - '.github/workflows/compare-revolution-fingerprints.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/compare_revolution_fingerprints.py
      - uses: actions/upload-artifact@v4
        with:
          name: revolution-fingerprint-comparison
          path: output_revolution_compare/
