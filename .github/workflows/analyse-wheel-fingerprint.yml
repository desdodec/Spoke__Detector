name: Analyse Wheel Fingerprint

on:
  push:
    paths:
      - 'audio/Spoke test new.wav'
      - 'src/analyse_wheel_fingerprint.py'
      - '.github/workflows/analyse-wheel-fingerprint.yml'
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/analyse_wheel_fingerprint.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-fingerprint-analysis
          path: output_wheel_fingerprint/
