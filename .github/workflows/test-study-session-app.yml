name: Test Study Session App

on:
  push:
    paths:
      - 'src/study_session_app.py'
      - 'src/study_session_analysis.py'
      - 'src/study_visualizer.py'
      - 'src/session_analyzer.py'
      - 'src/session_movement_analysis.py'
      - 'calibration/calibration_profile.json'
      - 'study/study_protocol.json'
      - 'requirements.txt'
      - '.github/workflows/test-study-session-app.yml'
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Syntax-check study app
        run: python -m py_compile src/study_session_app.py src/study_session_analysis.py src/study_visualizer.py src/session_movement_analysis.py src/session_analyzer.py

      - name: Analyse Jo Grant end to end
        run: |
          PYTHONPATH=src python src/study_session_analysis.py \
            'audio/Jo_Grant.wav' \
            'study_test/jo_grant' \
            --profile calibration/calibration_profile.json \
            --protocol study/study_protocol.json \
            --participant-id TEST_JO \
            --trial-id 1 \
            --outward-position A \
            --return-position B

      - name: Analyse Bike Test 2 end to end
        run: |
          PYTHONPATH=src python src/study_session_analysis.py \
            'audio/Bike test 2.wav' \
            'study_test/bike_test_2' \
            --profile calibration/calibration_profile.json \
            --protocol study/study_protocol.json \
            --participant-id TEST_BIKE2 \
            --trial-id 1 \
            --outward-position B \
            --return-position A

      - name: Verify standard subject records
        run: |
          test -f study_test/jo_grant/subject_record.csv
          test -f study_test/bike_test_2/subject_record.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          for path in [Path('study_test/jo_grant/subject_record.csv'), Path('study_test/bike_test_2/subject_record.csv')]:
              rows=list(csv.DictReader(path.open()))
              assert len(rows)==1, path
              assert rows[0]['protocol_id']=='SPOKE_GAIT_V1', rows[0]
              assert rows[0]['comparison_intervals_per_leg']=='180', rows[0]
          print('standard records verified')
          PY

      - name: Verify curated baseline visualiser
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import study_visualizer as v

          expected = {
              'Radial fingerprint',
              'Spoke-wheel barcode',
              'Concentric rhythm rings',
              '36-spoke aggregate glyph',
              'Woven stripes',
              'Poincare map',
              'Recurrence matrix',
              'Lag similarity map',
              'Grid weave',
          }
          assert set(v.STYLES) == expected, v.STYLES
          assert set(v.STYLE_GROUPS) == {'Signature', 'Pattern'}
          assert v.SOURCE_OPTIONS[0] == 'Baseline / first leg'
          assert {'Mono','Earth','Electric','Heatmap','Luxury'} == set(v.PALETTE_FAMILIES)

          for folder in [Path('study_test/jo_grant'), Path('study_test/bike_test_2')]:
              data = v.load_visual_data(folder)
              assert data.intervals_per_leg == 180
              for style in v.STYLES:
                  geom = v.build_geometry(
                      data, style, 1200, 900, 'Medium', 'Medium',
                      'Dark garment', 'Baseline / first leg', 'Neon Pulse'
                  )
                  assert geom.get('lines') or geom.get('rects') or geom.get('points') or geom.get('polygons'), style
                  assert v.STYLE_HELP[style]
              paths = v.export_all_default_styles(folder, source='Baseline / first leg', palette_name='Gold on Black')
              assert len(paths) == 10, paths
              for p in paths:
                  assert p.exists() and p.stat().st_size > 1000, p
              png = folder / 'artwork' / 'recurrence_colour_test.png'
              v.export_png(
                  png, data, 'Recurrence matrix',
                  source='Baseline / first leg', palette_name='Plasma', transparent=True
              )
              assert png.exists() and png.stat().st_size > 5000
          print('curated baseline visualiser verified')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: study-session-dry-run
          path: study_test/
