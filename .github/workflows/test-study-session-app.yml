name: Test Study Session App

on:
  push:
    paths:
      - 'src/study_session_app.py'
      - 'src/design_laboratory.py'
      - 'src/design_laboratory_app.py'
      - 'src/design_studio.py'
      - 'src/design_studio_app_v2.py'
      - 'src/design_randomizer.py'
      - 'src/transient_lab.py'
      - 'src/transient_lab_app.py'
      - 'src/study_session_analysis.py'
      - 'src/study_visualizer.py'
      - 'src/session_analyzer.py'
      - 'src/session_movement_analysis.py'
      - 'calibration/calibration_profile.json'
      - 'study/study_protocol.json'
      - 'requirements.txt'
      - '.github/workflows/test-study-session-app.yml'
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Syntax-check study and design apps
        run: python -m py_compile src/study_session_app.py src/design_laboratory.py src/design_laboratory_app.py src/design_studio.py src/design_studio_app_v2.py src/design_randomizer.py src/transient_lab.py src/transient_lab_app.py src/study_session_analysis.py src/study_visualizer.py src/session_movement_analysis.py src/session_analyzer.py

      - name: Verify acoustic click lab
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import csv
          import numpy as np
          from scipy.io import wavfile
          import transient_lab as t

          # Synthetic full-scale test: seven clearly separated short transients.
          sr = 44100
          duration = 1.0
          y = np.zeros(int(sr * duration), dtype=np.float64)
          truth = np.array([0.08, 0.20, 0.32, 0.44, 0.56, 0.68, 0.80])
          for j, ts in enumerate(truth):
              i = int(ts * sr)
              n = int(.010 * sr)
              q = np.arange(n) / sr
              burst = (.75 - .035*j) * np.sin(2*np.pi*(3400+80*j)*q) * np.exp(-q*450)
              y[i:i+n] += burst
          path = Path('study_test/synthetic_7_clicks.wav')
          path.parent.mkdir(parents=True, exist_ok=True)
          wavfile.write(path, sr, np.round(np.clip(y,-1,1)*32767).astype(np.int16))
          audio = t.load_wav(path)
          th, events = t.fit_threshold_for_count(audio, 7, 0, audio.duration_s, 35, 1200)
          assert len(events) == 7, (th, len(events))
          got = np.array([e.timestamp_seconds for e in events])
          assert np.max(np.abs(got-truth)) < .012, (got, truth)
          out = t.export_events_csv(Path('study_test/synthetic_7_clicks.csv'), events)
          assert out.exists()
          rows = list(csv.DictReader(out.open()))
          assert len(rows) == 7

          # The manually reviewed one-revolution clip contains 17 audible hits.
          known = t.load_wav(Path('audio/One Revolution.wav'))
          th17, ev17 = t.fit_threshold_for_count(known, 17, 0, known.duration_s, 25, 1200)
          assert len(ev17) == 17, (th17, len(ev17))
          assert all(ev17[i].timestamp_seconds < ev17[i+1].timestamp_seconds for i in range(16))
          print('acoustic click lab verified', th, th17)
          PY

      - name: Analyse Jo Grant end to end
        run: |
          PYTHONPATH=src python src/study_session_analysis.py \
            'audio/Jo_Grant.wav' \
            'study_test/jo_grant' \
            --profile calibration/calibration_profile.json \
            --protocol study/study_protocol.json \
            --participant-id TEST_JO \
            --trial-id 1 \
            --outward-position A \
            --return-position B

      - name: Analyse Bike Test 2 end to end
        run: |
          PYTHONPATH=src python src/study_session_analysis.py \
            'audio/Bike test 2.wav' \
            'study_test/bike_test_2' \
            --profile calibration/calibration_profile.json \
            --protocol study/study_protocol.json \
            --participant-id TEST_BIKE2 \
            --trial-id 1 \
            --outward-position B \
            --return-position A

      - name: Verify standard subject records
        run: |
          test -f study_test/jo_grant/subject_record.csv
          test -f study_test/bike_test_2/subject_record.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          for path in [Path('study_test/jo_grant/subject_record.csv'), Path('study_test/bike_test_2/subject_record.csv')]:
              rows=list(csv.DictReader(path.open()))
              assert len(rows)==1, path
              assert rows[0]['protocol_id']=='SPOKE_GAIT_V1', rows[0]
              assert rows[0]['comparison_intervals_per_leg']=='180', rows[0]
          print('standard records verified')
          PY

      - name: Verify curated baseline visualiser
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import study_visualizer as v
          expected = {
              'Radial fingerprint', 'Spoke-wheel barcode', 'Concentric rhythm rings',
              '36-spoke aggregate glyph', 'Woven stripes', 'Poincare map',
              'Recurrence matrix', 'Lag similarity map', 'Grid weave',
          }
          assert set(v.STYLES) == expected, v.STYLES
          assert set(v.STYLE_GROUPS) == {'Signature', 'Pattern'}
          assert v.SOURCE_OPTIONS[0] == 'Baseline / first leg'
          for folder in [Path('study_test/jo_grant'), Path('study_test/bike_test_2')]:
              data = v.load_visual_data(folder)
              assert data.intervals_per_leg == 180
              for style in v.STYLES:
                  geom = v.build_geometry(data, style, 1200, 900, 'Medium', 'Medium', 'Dark garment', 'Baseline / first leg', 'Neon Pulse')
                  assert geom.get('lines') or geom.get('rects') or geom.get('points') or geom.get('polygons'), style
          print('curated baseline visualiser verified')
          PY

      - name: Verify paired central-slice analysis
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import design_laboratory as lab
          import study_visualizer as v
          for folder in [Path('study_test/jo_grant'), Path('study_test/bike_test_2')]:
              data = v.load_visual_data(folder)
              paired = lab.paired_leg_analysis(data)
              assert paired['intervals_per_leg'] == 180
              assert abs(paired['equivalent_revolutions_per_leg'] - 5.0) < 1e-9
          print('paired central slices verified')
          PY

      - name: Verify generative design studio
        run: |
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path
          import json
          import design_studio as s
          import design_randomizer as r

          r.install()
          assert len(s.FAMILIES) == 10
          assert len(s.PALETTES) >= 26
          assert 'Bauhaus Signal' in s.PALETTES
          assert 'Laser Lemon' in s.PALETTES

          base = s.DesignParams(family='Tension Bloom', palette='Signal Mint', background='White')
          a = r.randomise_design(base, keep_family=True, seed=424242)
          b = r.randomise_design(base, keep_family=True, seed=424242)
          assert a == b
          assert a.family == 'Tension Bloom'
          assert 0.35 <= a.stroke_width <= 5.0
          form = r.randomise_form(base, seed=101)
          assert form.palette == base.palette and form.family == base.family
          colour = r.randomise_colour(base, seed=102)
          assert colour.palette != base.palette
          wild = [r.go_wild(base, seed=i) for i in range(20, 45)]
          assert any(p.stroke_width >= 3.1 for p in wild)
          assert any(p.detail <= 55 for p in wild)
          assert any(p.detail >= 185 for p in wild)

          for folder in [Path('study_test/jo_grant'), Path('study_test/bike_test_2')]:
              data = s.load_studio_data(folder)
              assert data.intervals.size == 180
              assert data.revolutions.shape == (5, 36)
              assert data.rev_norm.shape == (5, 36)

              for i, family in enumerate(s.FAMILIES):
                  p = r.randomise_design(s.DesignParams(family=family, background='Black'), keep_family=True, seed=100+i)
                  prim = s.build_primitives(data, p)
                  assert len(prim) > 4, family
                  png = folder / 'design_studio' / f'test_{i:02d}.png'
                  svg = folder / 'design_studio' / f'test_{i:02d}.svg'
                  s.export_png(png, data, p, size=700)
                  s.export_svg(svg, data, p, size=1200)
                  assert png.exists() and png.stat().st_size > 1500, png
                  assert svg.exists() and svg.stat().st_size > 800, svg

              saved = s.save_design(folder, data, a, 'ci_favourite')
              for path in saved.values():
                  assert path.exists() and path.stat().st_size > 100, path
              loaded = s.load_saved_params(saved['json'])
              assert loaded == a
              payload = json.loads(saved['json'].read_text())
              assert payload['locked_intervals'] == 180
              assert payload['spoke_count'] == 36
              assert payload['equivalent_revolutions'] == 5.0

              mock = s.render_shirt_mockup(data, a, size=700, shirt='Black')
              mock_path = folder / 'design_studio' / 'shirt_mockup_test.png'
              mock.save(mock_path)
              assert mock_path.stat().st_size > 2000
          print('generative design studio verified')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: study-session-dry-run
          path: study_test/
