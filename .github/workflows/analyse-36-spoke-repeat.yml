name: Analyse 36 Spoke Repeat

on:
  push:
    paths:
      - 'audio/Spoke test new.wav'
      - 'src/analyse_36_spoke_repeat.py'
      - '.github/workflows/analyse-36-spoke-repeat.yml'
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/analyse_36_spoke_repeat.py
      - uses: actions/upload-artifact@v4
        with:
          name: analysis-36-spoke-repeat
          path: output_36_spoke_repeat/
