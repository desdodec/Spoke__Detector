name: Analyse Spoke Pairs

on:
  push:
    paths:
      - 'audio/Spoke test new.wav'
      - 'src/analyse_spoke_pairs.py'
      - '.github/workflows/analyse-spoke-pairs.yml'
  workflow_dispatch:

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python src/analyse_spoke_pairs.py
      - uses: actions/upload-artifact@v4
        with:
          name: spoke-pair-analysis
          path: output_spoke_pairs/
